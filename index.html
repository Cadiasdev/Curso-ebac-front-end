<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" h-100>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de contato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flax align-items items-center py-4 bg" h-100>
    <main class="w-100 m-auto form-container">
        <form>
            <h1 class="h3 mb-3 fw-normal text-center text-white">Entre em contato</h1>
            <div class="form-floating">
                <label class="form-label" for="name">Nome</label>
                <input class="form-control" type="text" id="name" />
            </div>
            <div class="form-floating">
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" type="text" id="email" />
            </div>
            <div class="form-floating">
                <label class="form-label" for="telefone">Telefone</label>
                <input class="form-control" type="tel" placeholder="(+000)000-000-000" id="telefone" />
            </div>
            <div class="form-floating">
                <label class="form-label" for="mensagem">Deixa a sua mensagem</label>
                <textarea class="form-control" style="height: 150px;" id="mensagem"></textarea>
            </div>
            <div class="form-check form-switch">
                <label class="form-check-label" for="aceito-termos">Li e concordo com a política do site</label>
                <input class="form-check-input" type="checkbox" id="aceito-termos">
            </div>
            <button class="btn btn-primary w-100 py-2">Enviar</button>
        </form>
    </main>
</body>
</html>
